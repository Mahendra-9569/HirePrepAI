server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nginx's default request-body limit is 1 MB; multer allows 3 MB resumes.
    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's internal DNS server. Re-resolve "backend" every 10s so a
    # redeployed backend container (new IP) doesn't cause 502 errors.
    resolver 127.0.0.11 valid=10s;

    # API requests -> Express container (URI passed through unchanged)
    location /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Gemini report generation + PDF rendering can exceed the 60s default
        proxy_read_timeout 120s;
    }

    # Vite's built files have content hashes in their names: cache for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Always revalidate index.html so users get new deploys immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router: unknown paths (e.g. /interview/abc on refresh) get index.html
    location / {
        try_files $uri /index.html;
    }
}
